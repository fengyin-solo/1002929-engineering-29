# 本地开发唯一配置源（提交到仓库，所有入口都从这里取值）
# 用法：脚本里 `set -a; . "$(git rev-parse --show-toplevel)/dev.conf"; set +a`
# 前端由 scripts/gen-menu.mjs 之外的工具解析（vite.config.ts 内置解析），
# 后端由 backend/app/config.py 解析，docker-compose.yml 由 .env 间接引用。
#
# 改端口只改这里：起服务、健康检查、CORS、容器映射全部跟着走。

# 后端监听
DEV_HOST=127.0.0.1
DEV_BACKEND_PORT=8000

# 前端 dev server 监听
DEV_FRONTEND_PORT=5173

# 后端健康检查路径
DEV_HEALTH_PATH=/api/health
